name: Windows and Ubuntu drill verification
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked build and meaningful regressions
        shell: pwsh
        run: |
          dotnet restore tests/RecoveryDrill.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/RecoveryDrill.Tests -c Release --no-restore -- --work artifacts/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build clean exact-commit distributable
        run: python tools/package.py --rid ${{ matrix.rid }} --commit ${{ github.sha }} --work artifacts/build --out artifacts/delivery
      - name: Extract the actual archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts/extracted with spaces' -ErrorAction Stop | Out-Null
          $archive = Get-ChildItem -LiteralPath artifacts/delivery -File
          if (@($archive).Count -ne 1) { throw 'Exactly one package expected.' }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'artifacts/extracted with spaces' }
          else { tar -xzf $archive.FullName -C 'artifacts/extracted with spaces'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Execute extracted apphost with synthetic artifacts
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath 'artifacts/extracted with spaces' -Directory
          if (@($package).Count -ne 1) { throw 'Exactly one package root expected.' }
          python tools/check_package.py --package $package.FullName --work 'artifacts/package checks with spaces' --commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: tested-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/tests/receipt.json
            artifacts/build/archive.json
            artifacts/package checks with spaces/receipt.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify already-executed archives and create source/checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Publish tested preview without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --prerelease --title "$RELEASE_TAG — SQLite Recovery Drill" --notes-file docs/RELEASE-v0.1.0-preview.1.md
